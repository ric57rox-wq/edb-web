[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side routes resolve on refresh / deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep-alive: a daily scheduled function pings the Supabase REST root so the
# free-tier project doesn't auto-pause after 7 days of inactivity.
# (The function itself is added in the keep-alive build phase.)
# [functions."keepalive"]
#   schedule = "@daily"
